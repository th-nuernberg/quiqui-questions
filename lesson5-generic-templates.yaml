# Lesson 5 — Templates for questions with no right answer.
#
# When the question lives on your slide and you only want a live vote, omit the
# `correct` field. QuiQui then collects votes and shows the bar chart, but the
# Reveal button is hidden — there is nothing to mark green.

# ── Single choice: A / B / C / D ─────────────────────────────────────────────
- question: "Given the options on the slide, choose your answer! (A, B, C, D)"
  type: single
  answers:
    - option A
    - option B
    - option C
    - option D

# ── Multiple choice: A – E ───────────────────────────────────────────────────
- question: "Given the options on the slide, choose one or more answers! (A – E)"
  type: multiple
  answers:
    - "..."
    - "..."
    - "..."
    - "..."
    - "..."

# ── Yes / No ─────────────────────────────────────────────────────────────────
- question: "What do you think? (Yes / No)"
  type: single
  answers:
    - "Yes"
    - "No"

# ── True / False ─────────────────────────────────────────────────────────────
- question: "Is the statement true or false?"
  type: single
  answers:
    - "True"
    - "False"

# ── Agreement scale ──────────────────────────────────────────────────────────
- question: "To what extent do you agree?"
  type: single
  answers:
    - "Strongly agree"
    - "Agree"
    - "Neutral"
    - "Disagree"
    - "Strongly disagree"

# ── Rating scale ──────────────────────────────────---───────────────────────-
- question: "How is your overall rating?"
  type: single
  answers:
    - "Great 😄"
    - "Okay 🙂"
    - "Meh 😐"
    - "Awful 😞"

